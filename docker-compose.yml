services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: notify
      POSTGRES_PASSWORD: notify
      POSTGRES_DB: notify
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notify -d notify"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 2s

  event_processor:
    build:
      context: ./event_processor
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgres://notify:notify@postgres:5432/notify?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      NOTIFICATION_SERVICE_URL: http://notification_service:8081
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  notification_service:
    build:
      context: ./notification_service
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    environment:
      DATABASE_URL: postgres://notify:notify@postgres:5432/notify?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pg_data:
